[project]
name = "sensor-simulator"
version = "0.1.0"
description = "CGM sensor simulator — PyQt6 client for the nRF54L15 CGM firmware"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.11,<7",
    "matplotlib>=3.10,<4",
    "bleak>=3.0,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pylint>=3.3",
    "pyright>=1.1.390",
    "pytest>=8.3",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Lint + format — ruff (see docs/CODING_STANDARDS.md)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "firmware", "cgmsim", "build", "utils", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "C901", "PLR0915"]

# Size / complexity ceilings for new code (docs/CODING_STANDARDS.md):
#   - cyclomatic complexity per function: 10  (C901)
#   - statements per function: 60 (~100 lines) (PLR0915)
#   - lines per module: 1000 — pylint C0302, below.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# The physiological model ports use the single-capital symbols from the
# published equations / the C ports (I = plasma insulin, etc.). Renaming them
# to satisfy E741 would break parity with cgmsim/src/cgmsim_*.c and the papers.
"src/models/cambridge.py" = ["E741"]
"src/models/royparker.py" = ["E741"]
"src/models/uva_padova.py" = ["E741"]
# Residual style debt in the MainWindow god object + its satellite windows —
# see .scratch/thesis-stabilization/issues/18-arch-debt-mainwindow-god-object.md.
# Clear these as those windows get deepened; do not add rules here for new code.
# C901 / PLR0915: the Qt window __init__/_build_* methods and _scenario_dispatch
# predate the size ceilings; carried until those windows are deepened (issue 18).
"src/gui/*.py" = ["RUF012", "SIM105", "B905", "C408", "RUF001", "E501", "C901", "PLR0915"]
# ble_session's asyncio _session loop + decode_notification predate the size
# ceilings and are tracked with the rest of the BLE-layer debt (issue 18).
"src/services/ble_session.py" = ["C901", "PLR0915"]
# The hardware harnesses bootstrap sys.path before importing app modules, keep
# long-lived log handles open for the run, use os.path freely, and their
# run_once drivers are long by nature.
"scripts/*.py" = ["E402", "SIM115", "PTH123", "PTH110", "PTH118", "C901", "PLR0915"]

# ---------------------------------------------------------------------------
# Design-smell detector — pylint (disable=all + design/duplication only)
# ---------------------------------------------------------------------------
[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.messages_control]
# Design-smell detector only. The broader R09xx checks (too-many-locals /
# -statements / -arguments / -branches) fire heavily on the numerical model
# ports and Qt widget boilerplate, where they are noise — kept off on purpose.
disable = ["all"]
enable = [
    "R0902",  # too-many-instance-attributes  — the MainWindow god object (issue 18)
    "R0904",  # too-many-public-methods
    "C0302",  # too-many-lines (module) — ceiling 1000, below
]
# duplicate-code (R0801) is left off: the current hits (person/sensor config
# windows) are already tracked in issue 19, and it has no inline-disable.

[tool.pylint.design]
max-attributes = 15

[tool.pylint.format]
max-module-lines = 1000

[tool.pylint.typecheck]
generated-members = ["PyQt6.*"]

# ---------------------------------------------------------------------------
# Types — pyright (standard; pure modules must be clean)
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "scripts", "tests"]
extraPaths = ["src", "scripts"]  # bare imports in tests/scripts resolve
exclude = ["**/__pycache__", ".venv", "firmware", "cgmsim", "build"]

# src/models + src/api are held to full `standard` — they are clean today, so a
# new type error there fails the gate. The GUI + BLE layers carry a baseline of
# pre-existing issues (bleak's loose typing, the MainWindow god object reaching
# into private state — issue 18); their noisy reports are warnings, not errors,
# so the gate stays green while the debt is still visible.
[[tool.pyright.executionEnvironments]]
root = "src/gui"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalOperand = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportAttributeAccessIssue = "warning"
reportIncompatibleMethodOverride = "warning"
reportGeneralTypeIssues = "warning"
reportReturnType = "warning"

[[tool.pyright.executionEnvironments]]
root = "src/services"
reportOptionalMemberAccess = "warning"
reportArgumentType = "warning"
reportGeneralTypeIssues = "warning"

# The hardware harnesses drive the app through its private attributes on purpose;
# type-checking them adds no value.
[[tool.pyright.executionEnvironments]]
root = "scripts"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalOperand = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportPrivateImportUsage = "none"
reportGeneralTypeIssues = "none"
reportReturnType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
