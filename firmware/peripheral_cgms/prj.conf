# LED status indication
CONFIG_DK_LIBRARY=y

# Simulator: 4 independent CGM sensors on one board (see CONFIG_APP_SENSOR_COUNT
# in Kconfig — set it to 1 for the old single-sensor build and drop the BT
# counts below back to 1).
CONFIG_APP_SENSOR_COUNT=4

# Basic BT options
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_APP_PASSKEY=y
# Pairing on the multi-identity build — history:
#  * "Option B" (attempted 2026-09): CONFIG_BT_PRIVACY=n (stable static
#    addresses, no RPAs) + a bond slot per identity + peripheral-initiated
#    security (bt_conn_set_security in main.c's connected()). Tested on
#    hardware against Windows: identity 0 pairs and does encrypted GATT fine,
#    but identities 1-3 fail every time — serial shows
#    "Security failed ... level 1 err 2" (BT_SECURITY_ERR_AUTH_REQUIREMENT)
#    and Windows drops the link (reason 0x13). Same unresolved Windows +
#    Zephyr multi-identity LE-SC bug as before; forced legacy pairing (the
#    old workaround) is NOT re-introduced — it broke encrypted CGMS reads.
#  * "Option A" (ACTIVE): CONFIG_APP_CGMS_NO_AUTH drops the authenticated-
#    link requirement on the CGMS characteristics, so all N identities stream
#    with no pairing at all (acceptable for a simulator). It defaults ON for
#    APP_SENSOR_COUNT > 1 (see Kconfig) — no explicit line needed here.
#    BT_PRIVACY=n is kept regardless so the secondary identities have stable,
#    scannable addresses; a single-sensor build keeps real security.
CONFIG_BT_PRIVACY=n
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DEVICE_NAME="Nordic Glucose Sensor"
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_BT_SETTINGS=y

# External SPI-NOR (mx25r64) driver, for the sim_config storage_partition and
# the sim_csv_partition defined in boards/nrf54l15dk_nrf54l15_cpuapp.overlay —
# the board's default devicetree enables the node itself, but not these driver
# Kconfigs.
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# CRC32 (crc32_ieee_update) — used by src/csv_store.c to verify an uploaded
# CSV track against the CRC the app sends in the control BEGIN header.
CONFIG_CRC=y

# N BLE identities / advertising sets / CGMS instances — one per simulated
# sensor. Must equal CONFIG_APP_SENSOR_COUNT above.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=4
CONFIG_BT_ID_MAX=4
CONFIG_BT_MAX_CONN=4
# Buffer counts are left at their Zephyr defaults, which already scale with
# CONFIG_BT_MAX_CONN. Raising BT_BUF_ACL_TX_COUNT past the default trips a
# build-time assert unless BT_BUF_EVT_RX_COUNT is raised in lockstep; the CGMS
# push path already tolerates a transient -ENOMEM (it retries), so the defaults
# are fine here.
# With 4 links open, the SoftDevice Controller must fit 4 connection events
# into each interval. Its default max event length (7500 us) means 4 links at
# a ~15 ms discovery interval overrun the interval and the newest link is
# starved off mid-subscribe. Cap it so 4 events always fit; main.c also asks
# each central for a relaxed 30-50 ms interval on connect.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=2500
# Peripheral's preferred connection parameters (sent to the central so even
# the pre-update negotiation lands near here): 30-50 ms interval, 4 s timeout.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# Needed for bt_gatt_service_register(), used internally by bt_cgms_init()
# and by our own custom config_service.c registration.
CONFIG_BT_GATT_DYNAMIC_DB=y
# A full Person Config write is 137 bytes; default ATT MTU is too small.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
# Zephyr's ATT server rejects Prepare Write Request (needed for any write
# longer than ATT_MTU-3) with "Request Not Supported" unless this is nonzero
# — hit in practice: MTU exchange timing meant Person/Sensor Config's ~57-137
# byte writes arrived before a larger MTU was negotiated, falling back to a
# queued/long write. A too-small count then fails with "Prepare Queue Full"
# once a 137-byte write is chunked at a small (e.g. default 23-byte) MTU —
# worst case ~8 chunks, so 12 gives headroom regardless of MTU timing.
CONFIG_BT_ATT_PREPARE_COUNT=12

# CGMS Specific options
CONFIG_BT_CGMS=y
CONFIG_BT_CGMS_INSTANCE_COUNT=4
CONFIG_BT_CGMS_MAX_MEASUREMENT_RECORD=10
CONFIG_LOG=y
CONFIG_BT_CGMS_LOG_LEVEL_INF=y
CONFIG_SFLOAT=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280

# Needed for printk's %f/%.2f etc — used by model_thread.c's per-tick debug log.
CONFIG_CBPRINTF_FP_SUPPORT=y
