# LED status indication
CONFIG_DK_LIBRARY=y

# Basic BT options
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_APP_PASSKEY=y
# The original 4-sensor sample forced legacy pairing here because Windows
# reliably aborted the LE Secure Connections handshake against this board's
# *non-default* BLE identities (1-3) — its own comment noted the *default*
# identity paired fine with standard SC. This single-sensor build only ever
# uses the default identity (identity 0), so that workaround no longer
# applies and is left at Zephyr's default (SC preferred, falls back to
# legacy only if the peer can't do SC) rather than forced legacy — forcing
# legacy pairing was the likely cause of GATT reads/notifications on secured
# characteristics (e.g. CGM Measurement) failing with "Insufficient
# Authentication" even after pairing reported success.
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DEVICE_NAME="Nordic Glucose Sensor"
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_BT_SETTINGS=y

# External SPI-NOR (mx25r64) driver, for the sim_config storage_partition and
# the sim_csv_partition defined in boards/nrf54l15dk_nrf54l15_cpuapp.overlay —
# the board's default devicetree enables the node itself, but not these driver
# Kconfigs.
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# CRC32 (crc32_ieee_update) — used by src/csv_store.c to verify an uploaded
# CSV track against the CRC the app sends in the control BEGIN header.
CONFIG_CRC=y

# Single-sensor simulator: one BLE identity, one advertising set, one CGMS
# instance (see PROTOCOL_SPEC.md — down from the original sample's 4-sensor
# design, per the assignment's "one sensor sending data" requirement).
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
CONFIG_BT_ID_MAX=1
CONFIG_BT_MAX_CONN=1
# Needed for bt_gatt_service_register(), used internally by bt_cgms_init()
# and by our own custom config_service.c registration.
CONFIG_BT_GATT_DYNAMIC_DB=y
# A full Person Config write is 137 bytes; default ATT MTU is too small.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
# Zephyr's ATT server rejects Prepare Write Request (needed for any write
# longer than ATT_MTU-3) with "Request Not Supported" unless this is nonzero
# — hit in practice: MTU exchange timing meant Person/Sensor Config's ~57-137
# byte writes arrived before a larger MTU was negotiated, falling back to a
# queued/long write. A too-small count then fails with "Prepare Queue Full"
# once a 137-byte write is chunked at a small (e.g. default 23-byte) MTU —
# worst case ~8 chunks, so 12 gives headroom regardless of MTU timing.
CONFIG_BT_ATT_PREPARE_COUNT=12

# CGMS Specific options
CONFIG_BT_CGMS=y
CONFIG_BT_CGMS_INSTANCE_COUNT=1
CONFIG_BT_CGMS_MAX_MEASUREMENT_RECORD=20
CONFIG_LOG=y
CONFIG_BT_CGMS_LOG_LEVEL_INF=y
CONFIG_SFLOAT=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280

# Needed for printk's %f/%.2f etc — used by model_thread.c's per-tick debug log.
CONFIG_CBPRINTF_FP_SUPPORT=y
